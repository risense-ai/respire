<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Overview | Respire</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <script defer src="../mock-api/fixture.js"></script>
  <script defer src="gallery.js"></script>
  <script defer src="screens.js"></script>
</head>
<body data-page="overview">
  <aside aria-label="Navigation"></aside>
  <main>
    <div class="toolbar"><span>Studio / Overview</span><label>Scenario <select id="scenario"></select></label></div>
    <section class="heading"><h1>Workspace overview</h1><p>A snapshot of your notebook and its latest activity.</p></section>
    <section class="metrics" id="metrics"></section>
    <article class="fixed-card overview-model">
      <header><h2>Model &amp; Index Status</h2><a href="models.html">Open Models &rarr;</a></header>
      <div class="chip-row"><span id="index-state" class="pill"></span><span id="index-coverage"></span></div>
      <progress id="index-progress" max="100" value="0" aria-label="Index coverage"></progress>
      <p id="model-status"></p>
    </article>
    <article class="fixed-card recent-notes"><header><h2>Recent memories</h2><a href="workspace.html">Open workspace &rarr;</a></header><div id="results"></div></article>
    <p id="notice" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
