name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      core: ${{ steps.detect.outputs.core }}
      runtime: ${{ steps.detect.outputs.runtime }}
      cli: ${{ steps.detect.outputs.cli }}
      client2: ${{ steps.detect.outputs.client2 }}
      contracts: ${{ steps.detect.outputs.contracts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect affected components
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          run_all() {
            echo "core=true" >> "$GITHUB_OUTPUT"
            echo "runtime=true" >> "$GITHUB_OUTPUT"
            echo "cli=true" >> "$GITHUB_OUTPUT"
            echo "client2=true" >> "$GITHUB_OUTPUT"
            echo "contracts=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            run_all
          fi

          base=""
          range_args=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
            range_args=("${base}...${PR_HEAD_SHA}")
          elif [ "$EVENT_NAME" = "push" ]; then
            case "$EVENT_BEFORE" in
              0000000000000000000000000000000000000000) base="" ;;
              *) base="$EVENT_BEFORE" ;;
            esac
            range_args=("$base" "$EVENT_AFTER")
          fi

          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable diff base; enabling all component checks."
            run_all
          fi

          changed=$(git diff --name-only -z --no-renames "${range_args[@]}" | tr '\0' '\n')
          echo "Changed files:"
          printf '%s\n' "$changed"

          match_path() {
            grep -qE "$1" <<< "$changed"
          }

          core=false
          runtime=false
          cli=false
          client2=false
          contracts=false

          if match_path '^apps/core/'; then core=true; fi
          if match_path '^apps/runtime/'; then runtime=true; fi
          if match_path '^apps/cli/'; then cli=true; fi
          if match_path '^apps/client2/'; then client2=true; fi
          if match_path '^(contracts/|packages/|\.github/workflows/ci\.yml$|scripts/(check-guardrails|sync-contracts(\.test)?)\.mjs$)'; then
            contracts=true
          fi

          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          echo "client2=$client2" >> "$GITHUB_OUTPUT"
          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"

  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run architecture & Zero-CJK guardrails
        run: |
          node --test scripts/check-zero-cjk.test.mjs
          node scripts/check-guardrails.mjs

      - name: Verify tracked source line count ratchet
        shell: bash
        env:
          RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="$RATCHET_BASE"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Full-depth checkout fetches the trusted upstream branch.
            main=$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              git merge-base --is-ancestor HEAD "$main"
              base=$(git rev-parse --verify 'HEAD^1^{commit}')
            else
              base=$(git merge-base HEAD "$main")
            fi
          fi
          node --test scripts/check-line-ratchet.test.mjs
          node scripts/check-line-ratchet.mjs --base "$base"

          rustup toolchain install 1.95.0 --profile minimal
          export CARGO_TARGET_DIR="$RUNNER_TEMP/respire-panic-guard"
          cargo +1.95.0 test --locked --manifest-path scripts/rust-panic-guard/Cargo.toml
          cargo +1.95.0 build --locked --manifest-path scripts/rust-panic-guard/Cargo.toml
          export RESPIRE_RUST_PANIC_PARSER="$CARGO_TARGET_DIR/debug/respire-rust-panic-guard"
          node --test scripts/check-rust-panic.test.mjs
          node scripts/check-rust-panic.mjs --base "$base" --head "$(git rev-parse HEAD)" --parser "$RESPIRE_RUST_PANIC_PARSER"

      - name: Verify locked Core dependency graph
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          node --test scripts/check-core-dependencies.test.mjs
          node scripts/check-core-dependencies.mjs

  contract-check:
    name: contract-check
    needs: detect-changes
    if: needs.detect-changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout contract source
        uses: actions/checkout@v4
        with:
          repository: risense-ai/respire-resources
          ref: main
          path: contract-source
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify contract snapshot and lock
        run: |
          node scripts/sync-contracts.mjs --check contract-source
          node --test scripts/sync-contracts.test.mjs

      - name: Generate and test the Rust SDK
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          cargo +1.95.0 test --locked --manifest-path packages/runtime-sdk-rs/Cargo.toml

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/runtime-sdk-go/go.mod
          cache-dependency-path: packages/runtime-sdk-go/go.sum

      - name: Generate and test the Go SDK
        working-directory: packages/runtime-sdk-go
        env:
          GOTOOLCHAIN: local
          GOFLAGS: -mod=readonly
        run: |
          go generate ./...
          go test ./...

      - name: Generate and test the TypeScript SDK
        working-directory: packages/runtime-sdk-ts
        run: |
          npm ci --ignore-scripts
          npm run generate
          npm run check
          npm test


  core-ci:
    name: core-ci
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'true' || needs.detect-changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the matching Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare verified public model fixtures
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          fixtures="$RUNNER_TEMP/core-m3-fixtures"
          node apps/core/scripts/prepare-test-fixtures.mjs "$fixtures"
          {
            printf 'RSRS_CORE_TEST_MODEL_DIR=%s\n' "$fixtures"
            printf 'RSRS_CORE_TEST_ORT_FILE=%s\n' "$fixtures/onnx/model_quantized.cpu-v1.ort"
          } >> "$GITHUB_ENV"

      - name: Test the Core workspace
        run: cargo test --manifest-path apps/core/Cargo.toml --locked

  owner-credential-native:
    name: owner-credential-native (${{ matrix.host }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, arch: X64, host: x86_64-unknown-linux-gnu, suite: linux}
          - {runner: ubuntu-22.04-arm, arch: ARM64, host: aarch64-unknown-linux-gnu, suite: linux}
          - {runner: windows-2025, arch: X64, host: x86_64-pc-windows-msvc, suite: windows}
          - {runner: macos-15, arch: ARM64, host: aarch64-apple-darwin, suite: macos}
          - {runner: macos-15-intel, arch: X64, host: x86_64-apple-darwin, suite: macos}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned native Rust
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Verify native architecture and execute exact credential and proof cases
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_HOST: ${{ matrix.host }}
          NATIVE_SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          actual_host="$(rustc +1.95.0 -vV | sed -n 's/^host: //p')"
          test "$actual_host" = "$EXPECTED_HOST"
          run_exact() {
            local label="$1"
            shift
            local case_name="$1"
            shift
            local log="$RUNNER_TEMP/owner-transport-$label.log"
            cargo +1.95.0 test --locked --manifest-path apps/runtime/Cargo.toml -p respire_spawn --target "$EXPECTED_HOST" "$@" -- "$case_name" --exact --test-threads=1 --format pretty 2>&1 | tr -d '\r' | tee "$log"
            grep -Fx -- "test $case_name ... ok" "$log"
            grep -F -- 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log"
          }
          proof=owner_credential::proof::tests
          run_exact proof-vector "$proof::exact_wire_vector_and_time_endpoints" --lib
          run_exact proof-tamper "$proof::altered_claims_and_tag_wrong_key_epoch_are_invalid" --lib
          run_exact proof-format "$proof::canonical_header_and_mask_are_required" --lib
          run_exact proof-nonce "$proof::randomly_issued_proofs_use_distinct_nonces" --lib
          case "$NATIVE_SUITE" in
            linux|macos)
              unix=owner_credential::unix::tests
              run_exact rotation "$unix::record_round_trip_rotation_and_cleanup" --lib
              run_exact access "$unix::refuses_link_and_overbroad_permissions_without_touching_unrelated_file" --lib
              run_exact cleanup "$unix::refuses_replaced_directory_and_uses_instance_specific_cleanup" --lib
              run_exact filesystem "$unix::rejects_filesystems_without_verified_local_ownership" --lib
              ;;
            windows)
              windows=owner_credential::windows::tests
              run_exact rotation "$windows::windows_roundtrip_rotate_open_old_snapshot_and_clean" --lib
              run_exact access "$windows::windows_denies_short_links_and_insecure_object" --lib
              run_exact junction "$windows::windows_refuses_an_actual_junction_in_the_base_path" --lib
              run_exact persistent-acl "$windows::windows_requires_persistent_acl_support_from_the_open_volume" --lib
              run_exact acl owner_credential::windows::acl::tests::acl_denies_everyone_wrong_owner_and_inheritance --lib
              ;;
            *) exit 1 ;;
          esac

  owner-handshake-e2e:
    name: owner-handshake-e2e (${{ matrix.host }})
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-22.04, arch: X64, host: x86_64-unknown-linux-gnu, os: Linux, exe: rsrs-runtime}
          - {runner: windows-2025, arch: X64, host: x86_64-pc-windows-msvc, os: Windows, exe: rsrs-runtime.exe}
          - {runner: macos-15, arch: ARM64, host: aarch64-apple-darwin, os: macOS, exe: rsrs-runtime}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Check out the dispatched commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned native Rust
        run: rustup toolchain install 1.95.0 --profile minimal

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build actual native Runtime and exercise the owner handshake
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_HOST: ${{ matrix.host }}
          EXPECTED_OS: ${{ matrix.os }}
          EXE: ${{ matrix.exe }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
          test "$RUNNER_OS" = "$EXPECTED_OS"
          actual_host="$(rustc +1.95.0 -vV | sed -n 's/^host: //p')"
          test "$actual_host" = "$EXPECTED_HOST"
          target_dir="$RUNNER_TEMP/owner-handshake-target"
          if [ "$RUNNER_OS" = Linux ]; then
            export ORT_LIB_PATH="$RUNNER_TEMP/owner-handshake-gnu-ort"
            bash apps/runtime/scripts/prepare-gnu-ort.sh "$EXPECTED_HOST" "$ORT_LIB_PATH"
            export ORT_SKIP_DOWNLOAD=1 ORT_PREFER_DYNAMIC_LINK=1
            # The smoke deliberately strips inherited loader environment. Bind
            # this CI-only executable to the exact verified test ORT directory.
            export RUSTFLAGS="-C target-feature=-crt-static -C embed-bitcode=no -C link-arg=-Wl,-rpath,$ORT_LIB_PATH"
          fi
          cargo +1.95.0 build --locked --manifest-path apps/runtime/Cargo.toml \
            --target "$EXPECTED_HOST" --target-dir "$target_dir" -p respire_runtime --bin rsrs-runtime
          binary="$(node -e 'process.stdout.write(require("node:fs").realpathSync(process.argv[1]))' "$target_dir/$EXPECTED_HOST/debug/$EXE")"
          test -n "$binary"
          if [ "$RUNNER_OS" = Linux ]; then
            ldd "$binary" | tee "$RUNNER_TEMP/owner-handshake-ldd.log"
            grep -F -- "$ORT_LIB_PATH/libonnxruntime.so.1" "$RUNNER_TEMP/owner-handshake-ldd.log"
            if grep -F -- 'not found' "$RUNNER_TEMP/owner-handshake-ldd.log"; then exit 1; fi
          fi
          digest="$(node -e 'const h = require("node:crypto").createHash("sha256"); const f = require("node:fs").createReadStream(process.argv[1]); f.on("data", b => h.update(b)); f.on("end", () => process.stdout.write(h.digest("hex")));' "$binary")"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          printf 'Native Runtime: %s (sha256 %s)\n' "$binary" "$digest"
          log="$RUNNER_TEMP/owner-handshake-native.log"
          node apps/runtime/scripts/smoke-owner-handshake.mjs --runtime "$binary" --sha256 "$digest" 2>&1 | tr -d '\r' | tee "$log"
          grep -Fx -- 'Owner handshake: native scoped proof, six routes, denials, legacy RPC/MCP, and scoped stop passed.' "$log"
          if grep -F -- 'no Runtime launched' "$log"; then exit 1; fi

          run_native_case() {
            local package="$1" case_name="$2"
            shift 2
            local case_log="$RUNNER_TEMP/${case_name##*::}-native.log"
            set -- --lib "$case_name" -- --exact --test-threads=1 --format pretty "$@"
            if [ "$package" = respire_spawn ]; then
              set -- --features test-private-space-root "$@"
            fi
            cargo +1.95.0 test --locked --manifest-path apps/runtime/Cargo.toml \
              --target "$EXPECTED_HOST" --target-dir "$target_dir" -p "$package" "$@" \
              2>&1 | tr -d '\r' | tee "$case_log"
            grep -Fx -- "test $case_name ... ok" "$case_log"
            grep -F -- 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$case_log"
          }
          for case_name in \
            native_job_root_reserves_only_bounded_owner_private_children \
            model_job_rejects_non_directory_without_creating_a_stage \
            concurrent_owners_cannot_reserve_more_than_four_native_slots \
            failed_setup_releases_only_its_new_native_slot; do
            run_native_case respire_spawn "owner_credential::model_job::tests::$case_name"
          done

          if [ "$RUNNER_OS" = macOS ]; then
            export RSRS_NATIVE_CANDIDATE_TEST_BINARY="$binary"
            run_native_case respire_core_sdk \
              worker::candidate::tests::native_owned_candidate_can_be_reaped_without_retiring_foreground --ignored
            unset RSRS_NATIVE_CANDIDATE_TEST_BINARY
            (
              # SQLite tests use NOFOLLOW; avoid the logical /var alias on macOS.
              TMPDIR="$(cd -- "$RUNNER_TEMP" && pwd -P)"
              export TMPDIR
              for case_name in \
                wal_read_stays_old_across_interleaved_write_and_stale_publication_refuses \
                pending_target_and_physical_database_are_bound; do
                run_native_case respire_storage "transport::local::model_switch_source::tests::$case_name"
              done
            )
          fi

          (
            export RSRS_CORE_TEST_MODE=1
            if [ "$RUNNER_OS" = macOS ]; then
              TMPDIR="$(cd -- "$RUNNER_TEMP" && pwd -P)"
              export TMPDIR
            fi
            run_native_case respire_spawn owner_credential::backup_proof::tests::verifies_exact_claim_and_rejects_mismatches
            if [ "$RUNNER_OS" = Windows ]; then
              run_native_case respire_spawn owner_credential::windows::restore_stage::tests::private_restore_stage_enforces_owner_only_acl_under_inherited_parent
            fi
            run_native_case respire_storage transport::local::migration_backup::tests::restore_separates_pre_commit_failures_from_post_commit_checks
            run_native_case respire_commands runtime_http::v1::operations::backup_import::custody::tests::sweep_orphaned_stages_removes_crashed_stages_only
            run_native_case respire_commands runtime_http::v1::operations::backup_import::custody::tests::staged_import_enforces_owner_only_permissions
            run_native_case respire_commands runtime_http::v1::backup_export::tests::scoped_archive_over_loopback
          )

      - name: Verify the native macOS device-local catalog and SQLite migration fence
        if: runner.os == 'macOS'
        shell: bash
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          for case_name in \
            runtime_http::v1::operations::tests::scoped_sync_sse_on_production_router \
            runtime_http::v1::operations::tests::device_local_space_patch_on_production_router; do
            log="$RUNNER_TEMP/${case_name##*::}-native.log"
            cargo +1.95.0 test --locked --manifest-path apps/runtime/Cargo.toml \
              --target "$EXPECTED_HOST" --target-dir "$RUNNER_TEMP/owner-handshake-target" \
              -p respire_commands --lib "$case_name" -- --exact --test-threads=1 --format pretty 2>&1 | tee "$log"
            grep -Fx -- "test $case_name ... ok" "$log"
            grep -F -- 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log"
          done

          case_name=transport::local::migration_backup::tests::migration_backup_keeps_writer_fence_against_a_separate_process
          log="$RUNNER_TEMP/migration-writer-fence-native.log"
          unset RESPIRE_GOLDEN_LOCK_CHILD_DB
          cargo +1.95.0 test --locked --manifest-path apps/runtime/Cargo.toml \
            --target "$EXPECTED_HOST" --target-dir "$RUNNER_TEMP/owner-handshake-target" \
            -p respire_storage --lib "$case_name" -- --exact --test-threads=1 --format pretty 2>&1 | tee "$log"
          grep -Fx -- "test $case_name ... ok" "$log"
          grep -F -- 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log"

  runtime-ci:
    name: runtime-ci
    needs: detect-changes
    if: needs.detect-changes.outputs.runtime == 'true' || needs.detect-changes.outputs.core == 'true' || needs.detect-changes.outputs.contracts == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.95.0 --profile minimal

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned parser for Runtime registration check
        working-directory: packages/runtime-sdk-ts
        run: npm ci --ignore-scripts

      - name: Build and link Runtime with Core from this checkout
        shell: bash
        env:
          ROUTE_GAP_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TARGET: ${{ matrix.target }}
          RUSTUP_TOOLCHAIN: "1.95.0"
        run: |
          set -euo pipefail
          test "$(uname -m)-unknown-linux-gnu" = "$TARGET"
          export ORT_LIB_PATH="$RUNNER_TEMP/gnu-ort"
          bash apps/runtime/scripts/prepare-gnu-ort.sh "$TARGET" "$ORT_LIB_PATH"
          export ORT_SKIP_DOWNLOAD=1 ORT_PREFER_DYNAMIC_LINK=1
          export RUSTFLAGS='-C target-feature=-crt-static -C embed-bitcode=no'
          export RSRS_DATA_DIR="$RUNNER_TEMP/respire-runtime-data"
          mkdir -- "$RSRS_DATA_DIR"
          # Existing storage and migration tests opt into synthetic Core inference.
          RSRS_CORE_TEST_MODE=1 cargo test --manifest-path apps/runtime/Cargo.toml --locked --workspace --lib --tests --bins
          node --test apps/runtime/scripts/test-v1-route-parity.test.mjs
          route_gap_base="$ROUTE_GAP_BASE"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            route_gap_base=$(git rev-parse HEAD^)
          fi
          RSRS_CORE_TEST_MODE=1 node apps/runtime/scripts/test-v1-route-parity.mjs --reviewed-gap-ratchet --base "$route_gap_base"
          cargo test --manifest-path apps/runtime/Cargo.toml --locked --target "$TARGET" -p respire_commands --features e2e-loopback-mirror --lib runtime_http::v1::operations::model_download -- --test-threads=1
          node --test apps/runtime/scripts/stage-runtime-release.test.mjs
          if [ "$TARGET" = "x86_64-unknown-linux-gnu" ]; then
            cargo build --manifest-path apps/runtime/Cargo.toml --locked --release --target "$TARGET" --target-dir "$RUNNER_TEMP/e2e-stage-normal" --message-format=json -p respire_runtime --bin rsrs-runtime > "$RUNNER_TEMP/e2e-normal.jsonl"
            cargo build --manifest-path apps/runtime/Cargo.toml --locked --release --target "$TARGET" --target-dir "$RUNNER_TEMP/e2e-stage-feature" --message-format=json -p respire_runtime --features e2e-loopback-mirror --bin rsrs-runtime > "$RUNNER_TEMP/e2e-feature.jsonl"
            norm_ver="$("$RUNNER_TEMP/e2e-stage-normal/$TARGET/release/rsrs-runtime" --version)"
            feat_ver="$("$RUNNER_TEMP/e2e-stage-feature/$TARGET/release/rsrs-runtime" --version)"
            case "$norm_ver" in *+e2e-loopback-mirror*) exit 1 ;; esac
            case "$feat_ver" in *+e2e-loopback-mirror*) ;; *) exit 1 ;; esac
            node apps/runtime/scripts/test-e2e-loopback-stage-binary.mjs . "$TARGET" "$RUNNER_TEMP/e2e-stage-normal" "$RUNNER_TEMP/e2e-normal.jsonl" "$RUNNER_TEMP/e2e-stage-feature" "$RUNNER_TEMP/e2e-feature.jsonl" "$RUNNER_TEMP/e2e-stage-feature/$TARGET/release/rsrs-runtime"
          fi

  cli-ci:
    name: cli-ci
    needs: detect-changes
    if: needs.detect-changes.outputs.cli == 'true' || needs.detect-changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/cli
    env:
      RUST_TEST_THREADS: "1"
      RSRS_CONTRACT_FIXTURES: ${{ github.workspace }}/cli-frozen-fixtures/contracts/runtime-control
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Match the frozen consumer fixtures in apps/cli/SOURCE-PROVENANCE.md.
      - name: Checkout frozen CLI contract fixtures
        uses: actions/checkout@v4
        with:
          repository: risense-ai/respire-cli
          ref: 3a28019305839f0265a918c74178d3905b461bd0
          path: cli-frozen-fixtures
          sparse-checkout: /contracts/runtime-control/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Check CLI workspace
        run: cargo +1.95.0 check --locked --workspace --features respire/client2-host-prototype

      - name: Test CLI support crates
        run: cargo +1.95.0 test --locked --workspace --exclude respire

      # The product integration suites require a separately verified Runtime installation.
      - name: Test CLI frontend and client transport
        run: |
          cargo +1.95.0 test --locked -p respire --features client2-host-prototype \
            --test capabilities --test client_only_no_writes --test control_contract_fixtures \
            --test mcp_protocol --test runtime_help --test version_flag
          cargo +1.95.0 test --locked -p respire --features client2-host-prototype \
            --test net_rpc_http -- client_transport::
          for suite in client2_host:: mcp:: host_ui::inject::tests:: shell::; do
            cargo +1.95.0 test --locked -p respire --features client2-host-prototype --lib "$suite"
          done

      # These fixtures use disposable profiles and synthetic images, not a Runtime bundle.
      - name: Test isolated Runtime resolution and lifecycle
        run: |
          for suite in rpc::runtime_resolution_tests:: autostart::lifecycle::tests::; do
            cargo +1.95.0 test --locked -p respire --features client2-host-prototype --lib "$suite"
          done

      - name: Test account and space rejection contracts
        shell: pwsh
        run: |
          python3 -B scripts/test-account-rejection-source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/test-account-rejection-contract.ps1

  client2-ci:
    name: client2-ci
    needs: detect-changes
    if: needs.detect-changes.outputs.client2 == 'true' || needs.detect-changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check Client2 go.mod presence
        id: manifest
        run: |
          if [ -f "apps/client2/go.mod" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "apps/client2/go.mod not imported yet (pending OpenSpec 003); skipping Go test."
          fi

      - name: Setup Go
        if: steps.manifest.outputs.exists == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/client2/go.mod
          cache-dependency-path: |
            apps/client2/go.sum
            packages/runtime-sdk-go/go.sum

      - name: Setup Node
        if: steps.manifest.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify exact embedded Client2 WebUI export
        if: steps.manifest.outputs.exists == 'true'
        working-directory: apps/client2
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf -- "$tmp"' EXIT
          RESPIRE_E2E_EXPORT_WEBUI_DIR="$tmp/bundle" RESPIRE_E2E_PRODUCT_SHA="$(git rev-parse HEAD)"             go test -mod=readonly -count=1 -run '^TestExportEmbeddedWebUI$' -v             ./internal/desktop/frontend_assets.go ./internal/desktop/frontend_assets_export_test.go
          test -s "$tmp/bundle/webui.json"

      - name: Install Linux desktop dependencies
        if: steps.manifest.outputs.exists == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev fontconfig

      - name: Generate the canonical Runtime Go SDK
        if: steps.manifest.outputs.exists == 'true'
        working-directory: packages/runtime-sdk-go
        run: go generate ./...

      - name: Verify Client2 Go dependencies and tests
        if: steps.manifest.outputs.exists == 'true'
        working-directory: apps/client2
        env:
          CGO_ENABLED: '1'
        run: |
          go mod tidy -diff
          go vet -tags production,gtk3 ./...
          go test -tags production,gtk3 ./...

      - name: Run Client2 frontend regressions
        if: steps.manifest.outputs.exists == 'true'
        working-directory: apps/client2
        run: |
          node scripts/test-account-session-state.cjs
          node scripts/test-client-refresh.cjs
          node scripts/test-settings-proxy.cjs

  ci-gate:
    name: ci-gate
    needs: [detect-changes, guardrails, contract-check, core-ci, runtime-ci, cli-ci, client2-ci]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate required job results
        shell: bash
        env:
          DETECT: ${{ needs.detect-changes.result }}
          GUARDRAILS: ${{ needs.guardrails.result }}
          CONTRACTS: ${{ needs.contract-check.result }}
          CORE: ${{ needs.core-ci.result }}
          RUNTIME: ${{ needs.runtime-ci.result }}
          CLI: ${{ needs.cli-ci.result }}
          CLIENT2: ${{ needs.client2-ci.result }}
        run: |
          set -euo pipefail
          for name in DETECT GUARDRAILS CONTRACTS CORE RUNTIME CLI CLIENT2; do
            val="${!name}"
            echo "$name=$val"
            if [ "$val" = "success" ]; then
              continue
            fi
            if [ "$val" = "skipped" ] && [ "$name" != "DETECT" ] && [ "$name" != "GUARDRAILS" ]; then
              continue
            fi
            echo "::error::Gate failed because $name ended with '$val'"
            exit 1
          done
          echo "All triggered CI jobs passed (untouched components skipped)."
