name: Runtime Windows x64 release dry run

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]
    paths:
      - '.github/workflows/runtime-release-dry-run.yml'
      - 'apps/core/**'
      - 'apps/runtime/**'
      - 'scripts/component-release-plan.mjs'

permissions:
  contents: read

concurrency:
  group: runtime-release-dry-run-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    if: >-
      github.repository == 'risense-ai/respire' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'native-release-dry-run')))
    runs-on: windows-2025
    timeout-minutes: 50
    env:
      RUNTIME_COMPONENT_TAG: runtime-v2.0.0-dev.31
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned native Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build, stage and smoke the reviewed Runtime source
        run: node apps/runtime/scripts/dry-run-windows-x64-release.mjs
      - name: Keep the source-bound coverage envelope
        uses: actions/upload-artifact@v4
        with:
          name: runtime-windows-x64-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/runtime-windows-x64.json
          if-no-files-found: error
          retention-days: 7
      - name: Keep the verified main-branch dry-run bytes
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-windows-x64-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-assets/rsrs-runtime-x86_64-pc-windows-msvc.exe
            release-assets/rsrs-runtime-x86_64-pc-windows-msvc.tar.gz
            release-assets/runtime-build-x86_64-pc-windows-msvc.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
