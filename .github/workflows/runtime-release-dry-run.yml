name: Runtime native release dry run

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]
    paths:
      - '.github/workflows/runtime-release-dry-run.yml'
      - 'apps/core/**'
      - 'apps/runtime/**'
      - 'scripts/component-release-plan.mjs'

permissions:
  contents: read

concurrency:
  group: runtime-release-dry-run-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.lane }}
    if: >-
      github.repository == 'risense-ai/respire' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'native-release-dry-run')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            image: rsrs-runtime-x86_64-pc-windows-msvc.exe
          - lane: linux-gnu-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            image: rsrs-runtime-x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    env:
      RUNTIME_COMPONENT_TAG: runtime-v2.0.0-dev.31
      RUNTIME_DRY_RUN_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned native Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build, stage and smoke the reviewed Runtime source
        run: node apps/runtime/scripts/dry-run-native-release.mjs
      - name: Keep the source-bound coverage envelope
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.lane }}-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/runtime-${{ matrix.lane }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Keep the verified main-branch dry-run bytes
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.lane }}-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-assets/${{ matrix.image }}
            release-assets/rsrs-runtime-${{ matrix.target }}.tar.gz
            release-assets/runtime-build-${{ matrix.target }}.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
