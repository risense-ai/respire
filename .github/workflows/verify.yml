name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: verify-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-guardrails:
    name: verify-guardrails
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run architecture & Zero-CJK guardrails
        run: node scripts/check-guardrails.mjs

  verdict-gate:
    name: verdict-gate
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, 'respire-verdict:'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted governance scripts from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: _trusted
          persist-credentials: false

      - name: Select trusted governance root
        id: trusted-bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if [ -f _trusted/process/scripts/respire-process.mjs ]; then
            echo "need_legacy=false" >> "$GITHUB_OUTPUT"
            echo "script_root=_trusted" >> "$GITHUB_OUTPUT"
          else
            echo "need_legacy=true" >> "$GITHUB_OUTPUT"
            echo "script_root=_legacy_resources" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout pre-cutover governance bootstrap
        if: steps.trusted-bootstrap.outputs.need_legacy == 'true'
        uses: actions/checkout@v4
        with:
          repository: risense-ai/respire-resources
          ref: db89f9cb50b97cc7c412dbbca320e657019b4eec
          path: _legacy_resources
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Evaluate trusted Verifier verdict & publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          node "${{ steps.trusted-bootstrap.outputs.script_root }}/process/scripts/respire-process.mjs" verify-merge \
            "risense-ai/respire#${PR_NUMBER}" \
            --verdict-only \
            --publish-status

  evidence-register:
    name: evidence-register
    needs: [verify-guardrails]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted governance scripts from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: _trusted
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Register trusted post-merge Evidence & sync DAG
        env:
          GH_TOKEN: ${{ secrets.RESPIRE_BOT_TOKEN || github.token }}
        run: |
          node _trusted/process/scripts/respire-process.mjs evidence-register \
            --repo risense-ai/respire \
            --sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}"
