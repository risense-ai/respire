[package]
name = "respire_spawn"
version = "1.0.10"
edition = "2021"
rust-version = "1.88"
description = "Start the respire runtime without inheriting the caller's pipes"
license-file = "../LICENSE"
publish = false

[features]
test-private-space-root = []

[dependencies]
getrandom = "0.3"
hmac = "0.12"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Kernel", "Win32_System_JobObjects", "Wdk_System_Threading", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Security_Authorization", "Win32_System_IO", "Wdk_Foundation", "Wdk_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { version = "0.32", optional = true }
