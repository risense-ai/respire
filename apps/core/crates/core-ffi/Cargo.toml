[package]
name = "respire_core_ffi"
version = "1.0.0"
edition = "2021"
rust-version = "1.95"
description = "Respire C ABI implementation"
license-file = "../../LICENSE"
repository = "https://github.com/risense-ai/respire"
publish = false

[features]
default = ["cpu-owned-ort-experiment"]
native-fault-tests = ["respire_core/native-fault-tests"]
cpu-owned-ort-experiment = ["respire_core/cpu-owned-ort-experiment"]
mlx = ["respire_core/mlx"]

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
respire_core = { path = "../memory-core", default-features = false }
respire_protocol = { path = "../protocol" }
anyhow = "1.0"
base64 = "0.22"
unicode-width = "=0.2.0"
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lints.rust]
unsafe_code = "deny"
