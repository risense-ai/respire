[package]
name = "respire-runtime-sdk"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
progenitor-client = "=0.16.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
openapiv3 = "2.2"
progenitor = "=0.16.0"
serde_json = "1"
serde_yaml = "0.9"

prettyplease = "0.2"
syn = { version = "2", features = ["full", "visit-mut"] }
